name: Activity radar

# Regenerates assets/activity-radar.svg (contribution split across commits,
# PRs, code review, issues) so the README chart stays live. Schedule-only on
# purpose: a push trigger would loop, since this workflow itself pushes.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: activity-radar
  cancel-in-progress: true

jobs:
  update:
    name: Refresh activity radar
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate radar SVG
        env:
          # ACTIVITY_RADAR_TOKEN (optional secret): classic PAT with
          # repo + read:org scopes so private/org contributions are
          # included. Falls back to the default token, which sees
          # public contributions only.
          ACTIVITY_RADAR_TOKEN: ${{ secrets.ACTIVITY_RADAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_activity_radar.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain -- assets/activity-radar.svg)" ]; then
            echo "Radar unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-radar.svg
          git commit -m "chore: refresh activity radar"
          git push
